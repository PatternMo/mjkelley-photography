  <!-- Michael J. Kelley - favicon, adaptive (his ask 2026-09-30): transparent, black mark
       in light browser themes, light mark in dark themes (prefers-color-scheme). Mark scaled
       1.16 with a 3.6 ring so it holds up at 16 px. Same markup is inlined as a data URI in
       every page; Safari falls back to /favicon.ico (dark tile), iOS to /apple-touch-icon.png. -->
  <style>.r{fill:none;stroke:#1a1a1a}.m{fill:#1a1a1a}@media (prefers-color-scheme:dark){.r{stroke:#ece9e4}.m{fill:#ece9e4}}</style>
